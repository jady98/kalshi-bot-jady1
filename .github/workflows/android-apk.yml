name: Build BTC Radar APK
on:
  push:
    paths:
      - 'android-radar/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android-radar
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BTC-Radar-APK
          path: android-radar/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
# Rebuild latest standalone BTC Radar APK.
