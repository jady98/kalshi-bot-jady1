name: Build and emulator-test BTC Radar
on:
  push:
    paths:
      - 'android-radar/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android-radar
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BTC-Radar-APK
          path: android-radar/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Boot Android emulator and run BTC Radar
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r android-radar/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.jady.btcradar
            adb shell monkey -p com.jady.btcradar 1
            sleep 45
            adb shell screencap -p /sdcard/btc-radar-screen.png
            adb pull /sdcard/btc-radar-screen.png btc-radar-screen.png
            adb logcat -d -t 6000 > btc-radar-logcat.txt
            adb shell dumpsys activity activities | grep -q 'com.jady.btcradar/.MainActivity'
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BTC-Radar-Emulator-Evidence
          path: |
            btc-radar-screen.png
            btc-radar-logcat.txt
          if-no-files-found: warn
          retention-days: 14
