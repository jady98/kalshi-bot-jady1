name: Radar checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Check Python syntax
        run: python -m compileall -q app.py pattern_memory.py market_intelligence.py tests
      - name: Run BRTI feed regression tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q
